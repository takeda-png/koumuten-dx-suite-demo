const OW_T=(function(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())})();
const owD=s=>new Date(s+"T00:00:00");
const owAddY=(s,y)=>{const d=owD(s);d.setFullYear(d.getFullYear()+y);return d};
const owAddM=(b,m)=>{const d=new Date(b.getTime());d.setMonth(d.getMonth()+m);return d};
const owDays=d=>Math.round((d-OW_T)/864e5);
const owAgo=n=>new Date(OW_T.getTime()+n*864e5);
const owFmt=d=>d.getFullYear()+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+("0"+d.getDate()).slice(-2);
const owYM=n=>{
  const t=Math.round(n/30.44),y=Math.floor(t/12),m=t%12;
  if(y<=0)return (m>0?m+"ヶ月":"1ヶ月未満");
  return y+"年"+(m>0?m+"ヶ月":"");
};
const owRest=n=>n<0?Math.abs(n)+"日超過":(n<=90?"残り"+n+"日":"あと"+owYM(n));
/* 保証は「超過」ではなく「満了」。消耗品だけ「超過」と言う */
const owRest2=(n,kind)=>n>=0?owRest(n):(kind==="消耗品"?Math.abs(n)+"日超過":"満了（"+Math.abs(n)+"日前）");
const owYears=s=>owYM(-owDays(owD(s)));
const owWarrOf=o=>OW_WARR.filter(w=>!w.opt||o.ext)
  .map(w=>Object.assign({},w,{end:owAddY(o.hand,w.y),left:owDays(owAddY(o.hand,w.y))}))
  .sort((a,b)=>a.left-b.left);
const owEqOf=o=>o.eq.map(k=>{
  const q=OW_EQ[k];
  const ey=(o.ext&&q.ext)?q.ext:q.wy;
  const wend=owAddY(o.hand,ey);
  let con=null;
  if(q.ci>0&&q.con){
    let last=null,nx;
    if(o.conLast&&o.conLast[k]!==undefined){last=owAgo(o.conLast[k]);nx=owAddM(last,q.ci);}
    else{
      const bs=new Date(owD(o.hand).getTime()+(q.off||0)*864e5);
      nx=bs;let i=0;while(nx<=OW_T&&i<800){i++;nx=owAddM(bs,q.ci*i);}
    }
    con={name:q.con,every:q.ci,last:last,next:nx,left:owDays(nx)};
  }
  return Object.assign({},q,{k:k,ext2:!!(o.ext&&q.ext&&q.ext>q.wy),wyEff:ey,wend:wend,wleft:owDays(wend),con:con});
});
const owInspOf=o=>(OW_INSP[o.id]||[]).map(x=>{
  const d=owAddM(owD(o.hand),x.m);
  return {k:x.k,r:x.r,date:d,left:owDays(d)};
}).sort((a,b)=>a.left-b.left);
const owItems=o=>{
  const r=[];
  owWarrOf(o).forEach(w=>{r.push({home:o,kind:"保証",name:w.n,left:w.left,end:w.end});});
  owEqOf(o).forEach(q=>{
    r.push({home:o,kind:"設備保証",name:q.n+"（"+(q.ext2?"延長保証":"メーカー保証")+q.wyEff+"年）",left:q.wleft,end:q.wend});
    if(q.con)r.push({home:o,kind:"消耗品",name:q.n+" — "+q.con.name,left:q.con.left,end:q.con.next});
  });
  return r.sort((a,b)=>a.left-b.left);
};
const owAllItems=()=>{

};
const owAct=it=>{
  const n=it.name;
  if(it.kind!=="消耗品"&&it.left<0){
    if(n.indexOf("構造躯体")>=0||n.indexOf("雨水")>=0)return "法定10年が満了済み。延長できるかどうかを確認";

    return "保証は終了。修理が有償になることを伝え、延長保証か有償メンテを案内";
  }

  if(n.indexOf("防蟻")>=0)return "5年点検と同時に再施工すれば保証を5年延長できます（有償・目安18万円）";
  if(n.indexOf("構造躯体")>=0||n.indexOf("雨水")>=0)return "10年点検＋必要な有償メンテで保証を延長できます。満了後は延長できないので満了前の判断が必要";
  if(n.indexOf("建具")>=0)return "満了前に気になる箇所をまとめて是正します（無償）";
  if(n.indexOf("延長保証パック")>=0)return "更新のご案内。未加入だと設備の修理が都度実費になる点を説明";
  if(n.indexOf("地盤")>=0)return "20年保証。手続き不要";
  return "満了前に動作確認。延長保証に入れるかどうかをご案内";
};

function lvl(n){return n<0?"red":(n<=90?"amb":"ok")}

}

     +'紙の書類が見つからなくても、ここからいつでもご確認・印刷いただけます。</div>';
  });
  s+='<div class="note">※ 書類は彩の国ホーム側で登録しています。追加や差し替えが必要なものがあれば、ご相談タブからお知らせください。</div>';
  return s;
}
function viewI(){
  var s='<div class="sec-t">点検の履歴と次回のご案内</div><div class="card"><div class="tl">';
  insp.forEach(function(x){
    var k=x.left>0?"next":(x.r.indexOf("未実施")>=0?"miss":"");
    s+='<div class="tl-i '+k+'">'
     +'<div class="tl-d">'+esc(owFmt(x.date))+'　'+(x.left>0?"ご予定（"+esc(owRest(x.left))+"）":esc(Math.abs(x.left)+"日前"))+'</div>'
     +'<div class="tl-k">'+esc(x.k)+'</div><div class="tl-r">'+esc(x.r)+'</div></div>';
  });
  s+='</div>';
  var ask=pend||miss||next;
  if(ask){s+='<a class="btn full" href="#" data-go="c">'+esc(ask.k)+'の日程を相談する</a>'}
  s+='</div><div class="note">※ 定期点検（3ヶ月・1年・2年・5年・10年）は無償です。時期が近づいたら、こちらからLINEでご案内します。</div>';
  return s;
}
function viewC(){
  return '<div class="sec-t">気になることをお知らせください</div>'
  +'<div class="card"><form id="frm">'
  +'<label class="f">ご用件</label>'
  +'<select id="f1"><option>不具合・気になるところ</option><option>点検の日程のご相談</option><option>設備の交換・お手入れの依頼</option><option>リフォーム・増改築のご相談</option><option>延長保証について</option><option>書類の追加・再発行</option><option>その他</option></select>'
  +'<label class="f">場所・設備</label>'
  +'<select id="f2"><option>選んでください</option><option>屋根・外壁</option><option>玄関・サッシ</option><option>床・壁・天井</option><option>キッチン</option><option>浴室・洗面</option><option>トイレ</option><option>給湯・空調・換気</option><option>電気・照明</option><option>外構・庭</option><option>その他</option></select>'
  +'<label class="f">内容</label>'
  +'<textarea id="f3" rows="5" placeholder="例：2階の洋室の窓の下のクロスに、5cmほどの隙間ができました。"></textarea>'
  +'<label class="f">お写真（任意）</label>'
  +'<div class="sheet" style="margin:0">スマホで撮った写真をそのまま添付できます。写真があると、訪問する前に部材や職人の手配まで進められるので、解決が早くなります。<br><span style="color:#8a938e">※ このデモでは添付・送信は行われません。</span></div>'
  +'<button class="btn full" type="submit">この内容で送る</button>'
  +'</form></div>'
  +'<div class="card"><div class="c-name">お急ぎのとき</div>'
  +'<div class="c-rows"><div class="c-row"><span>水漏れ・停電・鍵のトラブルなど、お急ぎの場合はお電話ください。</span></div></div>'
  +'<div class="tel"><a class="btn" href="tel:0480000000">電話する</a><a class="btn g" href="mailto:after@example.com">メール</a></div>'
  +'<div class="note">平日 9:00-18:00 / 土 9:00-17:00(日祝休)</div></div>';
}
function render(){
  el("main").innerHTML=cur==="w"?viewW():(cur==="e"?viewE():(cur==="d"?viewD():(cur==="i"?viewI():viewC())));
  var bs=el("nav").getElementsByTagName("button");
  for(var i=0;i<bs.length;i++){bs[i].className=bs[i].getAttribute("data-t")===cur?"on":""}
  if(window.scrollY>240)window.scrollTo(0,240);
}
document.addEventListener("click",function(e){
  var t=(e.target&&e.target.closest)?e.target.closest("[data-t],[data-cp],[data-doc],[data-go]"):null;
  if(!t)return;
  if(t.hasAttribute("data-t")){cur=t.getAttribute("data-t");render();return}
  if(t.hasAttribute("data-go")){e.preventDefault();cur=t.getAttribute("data-go");render();return}
  if(t.hasAttribute("data-cp")){
    var v=t.getAttribute("data-cp");
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v)}
    t.textContent="コピーしました";
    setTimeout(function(){t.textContent="コピー"},1600);
    return;
  }
  if(t.hasAttribute("data-doc")){
    var sh=el("sh"+t.getAttribute("data-doc"));
    if(sh)sh.className=(sh.className.indexOf("hidden")>=0)?"sheet":"sheet hidden";
    return;
  }
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  var k=el("f1")?el("f1").value:"";
  el("main").innerHTML='<div class="done"><b>受け付けました（デモ表示）</b><br>ご用件：'+esc(k)
   +'<br>本番では彩の国ホームのアフター担当に通知が届き、担当者からLINEでご連絡します。<br><br>'
   +'<button class="btn g sm" data-t="w">保証にもどる</button></div>';
});
render();
</script>
</body>
</html>
