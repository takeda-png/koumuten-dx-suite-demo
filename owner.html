<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eceee9;color:#22303c;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;background:#f7f7f3;min-height:100vh;box-shadow:0 0 24px rgba(20,30,28,.07)}
.demo{background:#3d3a33;color:#f0ece2;font-size:11px;line-height:1.6;padding:7px 14px;text-align:center}
header{background:#16302b;color:#e8efea;padding:18px 18px 16px}
.hd-top{display:flex;align-items:center;gap:9px;font-size:11px;color:#9db5aa;letter-spacing:.12em}
.hd-mark{flex:0 0 30px;height:30px;border-radius:8px;background:#2f9e82;color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;letter-spacing:0}
.hd-name{font-size:21px;font-weight:800;margin-top:11px;letter-spacing:.02em}
.hd-meta{font-size:11.5px;color:#9db5aa;margin-top:5px;line-height:1.8}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 14px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#fff;border:1px solid #e0ded3;border-radius:10px;padding:8px 11px;min-width:108px}
.chip-l{font-size:10px;color:#8a938e}
.chip-v{font-size:14px;font-weight:800;margin-top:2px}
.chip.warn{border-color:#e8c9c0;background:#fdf3f0}
.chip.warn .chip-v{color:#a2453d}
.chip.soon{border-color:#e8ddc0;background:#fdf9ef}
.chip.soon .chip-v{color:#8a6a22}
nav{display:flex;background:#f7f7f3;position:sticky;top:0;z-index:5;border-bottom:1px solid #e0ded3;margin-top:12px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;background:none;border:none;border-bottom:2.5px solid transparent;padding:11px 14px;font-family:inherit;font-size:12.5px;color:#6d7873;cursor:pointer;white-space:nowrap}
nav button.on{color:#16302b;border-bottom-color:#2f9e82;font-weight:800}
main{padding:14px 14px 26px}
.sec-t{font-size:12px;color:#7e8b96;font-weight:700;margin:2px 0 9px}
.card{background:#fff;border:1px solid #e0ded3;border-radius:11px;padding:12px 13px;margin-bottom:9px}
.card.red{border-left:4px solid #c4554d}
.card.amb{border-left:4px solid #d19b3d}
.card.ok{border-left:4px solid #2f9e82}
.card.end{border-left:4px solid #d3d7d2}
.c-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.c-name{font-size:14px;font-weight:800;line-height:1.5;min-width:0}
.c-left{font-size:11.5px;font-weight:800;white-space:nowrap}
.c-left.red{color:#a2453d}
.c-left.amb{color:#8a6a22}
.c-left.ok{color:#1e7a62}
.c-left.end{color:#8a938e}
.c-rows{margin-top:7px;font-size:12px;color:#5c6b77}
.c-row{display:flex;gap:8px;padding:2px 0}
.c-row>b{flex:0 0 74px;color:#8a938e;font-weight:600}
.c-row>span{flex:1;min-width:0;word-break:break-word}
.mono{font-family:ui-monospace,Menlo,monospace}
.c-act{margin-top:8px;background:#f6faf8;border-radius:7px;padding:7px 9px;font-size:11.5px;color:#4a554f;line-height:1.75}
.c-act.warn{background:#fdf3f0;color:#7d3f39}
.btn{display:inline-block;background:#2f9e82;color:#fff;border:none;border-radius:9px;padding:11px 16px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;line-height:1.4}
.btn.g{background:#fff;color:#2f9e82;border:1.5px solid #2f9e82}
.btn.sm{padding:5px 11px;font-size:11px;border-radius:999px;font-weight:600}
.btn.full{display:block;width:100%;margin-top:10px}
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:4px;top:6px;bottom:8px;width:2px;background:#dfe4e0}
.tl-i{position:relative;padding:0 0 12px}
.tl-i:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:#2f9e82;border:2px solid #fff;box-shadow:0 0 0 1px #dfe4e0}
.tl-i.next:before{background:#d19b3d}
.tl-i.miss:before{background:#c4554d}
.tl-d{font-size:11px;color:#8a938e}
.tl-k{font-size:13.5px;font-weight:800}
.tl-r{font-size:12px;color:#5c6b77}
.doc{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e0ded3;border-radius:10px;padding:11px 12px;margin-bottom:7px;cursor:pointer;width:100%;text-align:left;font-family:inherit}

.doc-b{flex:1;min-width:0}
.doc-n{font-size:13px;font-weight:700;line-height:1.5}
.doc-m{font-size:10.5px;color:#8a938e}
.doc-a{flex:0 0 auto;font-size:11px;color:#2f9e82;font-weight:700}
.sheet{background:#fff;border:1px dashed #cfd8d3;border-radius:10px;padding:14px;margin:-3px 0 9px;font-size:12px;color:#5c6b77;line-height:1.9}
.sheet>b{display:block;color:#22303c;font-size:13px;margin-bottom:6px}
label.f{display:block;font-size:11.5px;color:#5c6b77;font-weight:700;margin:11px 0 4px}
select,textarea{width:100%;font-family:inherit;font-size:13px;border:1px solid #cfd8d3;border-radius:8px;padding:9px 10px;background:#fff;color:#22303c}
textarea{resize:vertical;line-height:1.7}
.done{background:#ddf0e9;color:#1e7a62;border-radius:10px;padding:16px;font-size:12.5px;line-height:1.9;text-align:center}
.done>b{font-size:14px}
.tel{display:flex;gap:8px;margin-top:10px}
.tel>*{flex:1}
footer{background:#16302b;color:#9db5aa;padding:18px;font-size:11px;line-height:1.9}
footer>b{color:#e8efea;font-size:12.5px;display:block;margin-bottom:4px}
.note{font-size:11px;color:#8a938e;line-height:1.8;margin-top:10px}
.hidden{display:none}
.doc-sub{font-size:10.5px;color:#8a938e;line-height:1.5;margin-top:2px}
.doc-who{display:inline-block;font-size:9.5px;font-weight:700;border-radius:999px;padding:1px 7px;margin-right:5px}
.doc-who.self{color:#1e7a62;background:#ddf0e9}
.doc-who.third{color:#5c6b77;background:#eef1ee}
.sh{background:#fff;border:1px solid #e0ded3;border-radius:10px;padding:16px 14px;margin:-3px 0 9px}
.sh-h{text-align:center;font-size:15px;font-weight:800;letter-spacing:.1em;padding-bottom:9px;border-bottom:2px solid #16302b;margin-bottom:12px}
.sh-lead{font-size:11.5px;line-height:1.95;color:#4a554f;margin-bottom:12px}

.sh-tbl td{border:1px solid #e5e2d8;padding:6px 7px;vertical-align:top;word-break:break-word}
.sh-scroll{overflow-x:auto;margin-bottom:12px}
.sh-t{width:100%;border-collapse:collapse;font-size:11px;min-width:310px}

.sh-t td{border:1px solid #e5e2d8;padding:5px 6px;vertical-align:top}
.sh-t td.c{text-align:center;white-space:nowrap}
.sh-t td.end{color:#8a938e}
.sh-sec{font-size:12px;font-weight:800;margin:14px 0 7px;padding-left:8px;border-left:3px solid #2f9e82}
.sh-c{margin-bottom:10px}
.sh-c>b{display:block;font-size:12px;margin-bottom:2px}
.sh-c p{font-size:11px;line-height:1.95;color:#4a554f;text-indent:1em}

.sh-sign{margin-top:14px;border-top:1px solid #e5e2d8;padding-top:10px;font-size:11px;line-height:1.95}

.sh-note{background:#fdf7ea;border:1px solid #e8ddc0;border-radius:7px;padding:8px 10px;font-size:10.5px;line-height:1.8;color:#7d6a3f;margin-top:10px}

#printArea{display:none}
@media print{
 body{background:#fff}

 #printArea .sh{border:none;border-radius:0;padding:0;margin:0}
 #printArea .sh-act,#printArea .sh-note{display:none}
 @page{size:A4;margin:16mm}
}
</style>

function inspAct(r){
  if(r.indexOf("是正済")>=0)return "是正を完了しました。";
  if(r.indexOf("有償")>=0)return "有償工事として実施しました。";
  if(r.indexOf("是正なし")>=0)return "指摘事項はありませんでした。";
  return "—";
}
function shInspect(){
  var done=insp.filter(function(x){return x.left<=0&&x.r.indexOf("未実施")<0&&x.r.indexOf("調整中")<0});
  var rec=done.length?done[done.length-1]:null;
  var KW=[["建具","建具の建付け・開閉"],["クロス","クロスの隙間・浮き"],["外壁","外壁の割れ・浮き"],
          ["コーキング","シーリングの劣化"],["シーリング","シーリングの劣化"],["床","床の沈み・きしみ"]];
  var flagged={};
  if(rec)KW.forEach(function(k){if(rec.r.indexOf(k[0])>=0)flagged[k[1]]=1});
  var body="";
  OW_INSP_ITEMS.forEach(function(g){
    g[1].forEach(function(it,i){
      var bad=flagged[it];
      body+='<tr>'+(i===0?'<td rowspan="'+g[1].length+'" class="c">'+esc(g[0])+'</td>':'')
        +'<td>'+esc(it)+'</td>'
        +OW_INSP_JUDGE.map(function(j){
           var on=(j==="要是正")?bad:(j==="良"?!bad:false);
           return '<td class="c">'+(on?"○":"")+'</td>';
         }).join('')+'</tr>';
    });
  });
  var rows=propRows().slice(0,4);
  rows.push(["点検の種類", rec?esc(rec.k):'<span style="color:#8a938e">—</span>']);
  rows.push(["点検日", rec?esc(owFmt(rec.date)):'<span style="color:#8a938e">—</span>']);
  rows.push(["点検者", esc(o.staff.split("/").pop().trim())+"　ほか1名"]);
  return '<div class="sh" id="sh-inspect">'+shHead("定期点検 記録票")
   +shTbl(rows)
   +'<div class="sh-sec">点検項目と判定</div>'
   +'<div class="sh-scroll"><table class="sh-t"><thead><tr><th>区分</th><th>項目</th>'
   +OW_INSP_JUDGE.map(function(j){return '<th style="text-align:center">'+esc(j)+'</th>'}).join('')
   +'</tr></thead><tbody>'+body+'</tbody></table></div>'
   +'<div class="sh-sec">指摘事項と対応</div>'
   +shTbl([["指摘の内容", rec?esc(rec.r):'<span style="color:#8a938e">—</span>'],
           ["対応", rec?inspAct(rec.r):"—"],
           ["次回の点検", next?esc(next.k)+"（"+esc(owFmt(next.date))+"　"+esc(owRest(next.left))+"）":
             (miss?'<span style="color:#a2453d">期限を超過しています。日程の調整をお願いします。</span>':"—")]])
   +'<div class="sh-note">この記録票はお客様控えです。点検の記録は、保証を適用するかどうかを判断するときの'
   +'資料になりますので、大切に保管してください（このページからいつでもご覧いただけます）。</div>'
   +signBlock()+printBtn("inspect")+'</div>';
}

/* ⑤ 設備一覧 — 印刷して貼れる1枚 */
function shEquip(){
  var rows=ord2(eqs).map(function(q){
    return '<tr><td>'+esc(q.n)
      +'<div style="color:#8a938e;font-size:10px">'+esc(q.cat)+'</div></td>'
      +'<td>'+esc(q.mk)+'<div class="mono" style="font-size:10.5px">'+esc(q.mo)+'</div></td>'
      +'<td class="c'+(q.wleft<0?' end':'')+'">'+esc(owFmt(q.wend))+'</td>'
      +'<td>'+(q.con?esc(q.con.name)+'<div style="color:#8a938e;font-size:10px">'+q.con.every+'ヶ月ごと／次回 '+esc(owFmt(q.con.next))+'</div>':'—')+'</td></tr>';
  }).join('');
  return '<div class="sh" id="sh-equip">'+shHead("設備一覧（型番・保証・お手入れ）")
   +'<div class="sh-lead">'+esc(o.label)+'に設置されている設備の一覧です。'
   +'フィルターや電池をご自分で購入されるときは、この型番でお探しください。</div>'
   +shTbl(propRows().slice(0,4))
   +'<div class="sh-scroll"><table class="sh-t"><thead><tr><th>品名・区分</th><th>メーカー・型番</th>'
   +'<th>保証満了</th><th>お手入れ</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
   +'<div class="sh-note">この1枚を印刷して、洗面台の扉裏や分電盤の近くに貼っておくと、'
   +'いざというときにすぐ確認できます。メーカー名と型番はデモ用の架空の値です。</div>'
   +printBtn("equip")+'</div>';
}

/* 原本を開くだけの書類（第三者発行 ＋ 図面・仕様書） */
function shFile(d){
  var rows=[["発行元", esc(d.issuer||OW_CI.name)]];
  if(d.no)rows.push(["番号", esc(d.no)]);
  rows.push(["ページ数", "全"+d.pg+"ページ"]);
  rows.push(["保管", esc(OW_CO)+"が原本をお預かりしています"]);
  return '<div class="sh" id="sh-'+esc(d.id)+'">'
   +(d.point?'<div class="sh-lead">'+esc(d.point)+'</div>':'')
   +shTbl(rows)
   +'<div class="sh-file">原本（PDF）はこのデモには入っていません。<br>'
   +'本番では、お引渡しのときにお渡しした書類をそのまま開けます。</div>'
   +(d.who==="third"
     ?'<div class="sh-note">この書類は'+esc(d.issuer)+'が発行したものです。'+esc(OW_CO)+'が発行することはできませんので、'
      +'原本をお預かりして、このページからいつでもご覧いただけるようにしています。</div>'
     :'')
   +'</div>';
}
function ord2(a){
  return a.filter(function(x){return (x.left!==undefined?x.left:x.wleft)>=0})
    .concat(a.filter(function(x){return (x.left!==undefined?x.left:x.wleft)<0}).reverse());
}
function docBody(d){
  if(d.mode!=="sheet")return shFile(d);
  if(d.id==="summary")return shSummary();
  if(d.id==="jisha")return shJisha();
  if(d.id==="bougi")return shBougi();
  if(d.id==="inspect")return shInspect();
  if(d.id==="equip")return shEquip();
  return shFile(d);
}
function viewD(){
  var s='<div class="sec-t">保証書・図面・取扱説明書（'+OW_DOCS.length+'点）</div>';
  OW_DOCS.forEach(function(d){
    var icon=d.t==="図面"?"▤":(d.t==="説明書"?"☰":(d.t==="点検"?"✓":(d.t==="設備"?"⚙":"⛨")));
    s+='<button class="doc" data-doc="'+esc(d.id)+'"><div class="doc-i">'+icon+'</div>'
     +'<div class="doc-b"><div class="doc-n">'+esc(d.n)+'</div>'
     +'<div class="doc-sub"><span class="doc-who '+d.who+'">'+(d.who==="self"?esc(OW_CO):"原本をお預かり")+'</span>'
     +esc(d.sub)+'</div></div>'
     +'<div class="doc-a">開く</div></button>'
     +'<div class="hidden" id="wrap-'+esc(d.id)+'">'+docBody(d)+'</div>';
  });
  s+='<div class="note">※ 「'+esc(OW_CO)+'」と表示のある書類は当社が発行したものです。'
   +'保険・地盤・行政の書類は発行元が別のため、当社が原本をお預かりしてここに置いています。<br>'
   +'追加や差し替えが必要なものがあれば、ご相談タブからお知らせください。</div>';
  return s;
}
function viewI(){
  var s='<div class="sec-t">点検の履歴と次回のご案内</div><div class="card"><div class="tl">';
  insp.forEach(function(x){
    var k=x.left>0?"next":(x.r.indexOf("未実施")>=0?"miss":"");
    s+='<div class="tl-i '+k+'">'
     +'<div class="tl-d">'+esc(owFmt(x.date))+'　'+(x.left>0?"ご予定（"+esc(owRest(x.left))+"）":esc(Math.abs(x.left)+"日前"))+'</div>'
     +'<div class="tl-k">'+esc(x.k)+'</div><div class="tl-r">'+esc(x.r)+'</div></div>';
  });
  s+='</div>';
  var ask=pend||miss||next;
  if(ask){s+='<a class="btn full" href="#" data-go="c">'+esc(ask.k)+'の日程を相談する</a>'}
  s+='</div><div class="note">※ 定期点検（3ヶ月・1年・2年・5年・10年）は無償です。時期が近づいたら、こちらからLINEでご案内します。</div>';
  return s;
}
function viewC(){
  return '<div class="sec-t">気になることをお知らせください</div>'
  +'<div class="card"><form id="frm">'
  +'<label class="f">ご用件</label>'
  +'<select id="f1"><option>不具合・気になるところ</option><option>点検の日程のご相談</option><option>設備の交換・お手入れの依頼</option><option>リフォーム・増改築のご相談</option><option>延長保証について</option><option>書類の追加・再発行</option><option>その他</option></select>'
  +'<label class="f">場所・設備</label>'
  +'<select id="f2"><option>選んでください</option><option>屋根・外壁</option><option>玄関・サッシ</option><option>床・壁・天井</option><option>キッチン</option><option>浴室・洗面</option><option>トイレ</option><option>給湯・空調・換気</option><option>電気・照明</option><option>外構・庭</option><option>その他</option></select>'
  +'<label class="f">内容</label>'
  +'<textarea id="f3" rows="5" placeholder="例：2階の洋室の窓の下のクロスに、5cmほどの隙間ができました。"></textarea>'
  +'<label class="f">お写真（任意）</label>'
  +'<div class="sheet" style="margin:0">スマホで撮った写真をそのまま添付できます。写真があると、訪問する前に部材や職人の手配まで進められるので、解決が早くなります。<br><span style="color:#8a938e">※ このデモでは添付・送信は行われません。</span></div>'
  +'<button class="btn full" type="submit">この内容で送る</button>'
  +'</form></div>'
  +'<div class="card"><div class="c-name">お急ぎのとき</div>'
  +'<div class="c-rows"><div class="c-row"><span>水漏れ・停電・鍵のトラブルなど、お急ぎの場合はお電話ください。</span></div></div>'
  +'<div class="tel"><a class="btn" href="tel:0480000000">電話する</a><a class="btn g" href="mailto:after@example.com">メール</a></div>'
  +'<div class="note">平日 9:00-18:00 / 土 9:00-17:00(日祝休)</div></div>';
}
function render(){
  el("main").innerHTML=cur==="w"?viewW():(cur==="e"?viewE():(cur==="d"?viewD():(cur==="i"?viewI():viewC())));
  var bs=el("nav").getElementsByTagName("button");
  for(var i=0;i<bs.length;i++){bs[i].className=bs[i].getAttribute("data-t")===cur?"on":""}
  if(window.scrollY>240)window.scrollTo(0,240);
}
document.addEventListener("click",function(e){
  var t=(e.target&&e.target.closest)?e.target.closest("[data-print],[data-t],[data-cp],[data-doc],[data-go]"):null;
  if(!t)return;
  if(t.hasAttribute("data-t")){cur=t.getAttribute("data-t");render();return}
  if(t.hasAttribute("data-go")){e.preventDefault();cur=t.getAttribute("data-go");render();return}
  if(t.hasAttribute("data-cp")){
    var v=t.getAttribute("data-cp");
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v)}
    t.textContent="コピーしました";
    setTimeout(function(){t.textContent="コピー"},1600);
    return;
  }
  if(t.hasAttribute("data-print")){
    var src=el("sh-"+t.getAttribute("data-print"));
    if(src){el("printArea").innerHTML=src.innerHTML;window.print();}
    return;
  }
  if(t.hasAttribute("data-doc")){
    var wr=el("wrap-"+t.getAttribute("data-doc"));
    if(wr){
      var open=wr.className.indexOf("hidden")<0;
      wr.className=open?"hidden":"";
      var a=t.querySelector(".doc-a");
      if(a)a.textContent=open?"開く":"閉じる";
    }
    return;
  }
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  var k=el("f1")?el("f1").value:"";
  el("main").innerHTML='<div class="done"><b>受け付けました（デモ表示）</b><br>ご用件：'+esc(k)
   +'<br>本番では彩の国ホームのアフター担当に通知が届き、担当者からLINEでご連絡します。<br><br>'
   +'<button class="btn g sm" data-t="w">保証にもどる</button></div>';
});
render();
</script>
</body>
</html>
